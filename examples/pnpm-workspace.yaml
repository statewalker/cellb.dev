# The examples: apps that use cellb as its users do, from npm, at a released range
# ("@statewalker/cellb": "~0.1.0"). A workspace of their own, outside cellb's (../), with its
# own lockfile, so a change to cellb reaches them only through a release: Dependabot raises the
# range, and the nightly canary (.github/workflows/examples-canary.yml) runs them against main.
packages:
  - "*"

catalog:
  "@types/node": ^26.6.4
  typescript: ^7.0.2
  vite: ^8.3.2
  vitest: ^5.0.3
