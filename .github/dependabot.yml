# The statewalker convention (statewalker/.github README): weekly, ranges kept while new versions
# fit them, versions younger than 3 days skipped, grouped pull requests merged by hand.
# Two npm workspaces: cellb's (/) and the examples' (/examples). A new @statewalker/cellb
# release reaches the examples through the /examples group: the pull request runs them on it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
    groups:
      statewalker:
        patterns: ["@statewalker/*"]
      external-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@statewalker/*"]
        update-types: [minor, patch]
    ignore:
      # 0.1.7 to 0.1.9 fail to load in a browser: their own post-js sets Module.postRun after
      # Emscripten has run it ("Attempt to set `Module.postRun` after it has already been
      # processed"), so cellb's sqlite_vec e2e project (celld-projects vectordb) cannot start.
      - dependency-name: sqlite-vec-wasm-demo
        versions: ["0.1.7", "0.1.8", "0.1.9"]
      # zod is here for scripts/vendor-miniflare.mjs only: it bundles the zod Miniflare's
      # simulators are written for, which is zod 3 (miniflare 4: "zod": "^3.25.76").
      - dependency-name: zod
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 3
    groups:
      statewalker:
        patterns: ["@statewalker/*"]
      external-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@statewalker/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
