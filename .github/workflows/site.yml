name: site

# The website (site/): built on every pull request that touches it, and published from main to
# the httpeers static-site host, as statewalker/httpeers publishes its sites. A site there is a
# first-level prefix of the `sites` bucket named after its domain (https://s3.httpeers.net, S3 on
# RustFS); the host serves `<domain>/…` for `Host: <domain>`. For a *.httpeers.net name nothing
# else is needed: the zone has a wildcard DNS record and Caddy a wildcard certificate. See
# statewalker/httpeers apps/sites/README.md and tools/publish/README.md.
#
# Settings (repository → Settings → Secrets and variables → Actions):
#   secret   HTTPEERS_S3_ACCESS_KEY_ID, HTTPEERS_S3_SECRET_ACCESS_KEY   credentials that can write
#            the site's prefix of the `sites` bucket (site/README.md: not RustFS's own pair)
#   variable SITE_DOMAIN                       where to publish (default: cellb.httpeers.net)
# Without the secrets the site is built and the publish step says it was skipped.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The "By the numbers" section reads the recorded benchmark runs at build time.
      - "packages/cellb/bench/results/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "packages/cellb/bench/results/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# One publish at a time, the latest commit last; pull requests cancel their own older runs.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'cellb.httpeers.net' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @statewalker/cellb-site build

      - name: Publish to https://${{ env.SITE_DOMAIN }}
        if: github.event_name != 'pull_request'
        env:
          RCLONE_CONFIG_HTTPEERS_TYPE: s3
          RCLONE_CONFIG_HTTPEERS_PROVIDER: Other
          RCLONE_CONFIG_HTTPEERS_ENDPOINT: https://s3.httpeers.net
          # Path-style addressing: virtual-host style would look up sites.s3.httpeers.net.
          RCLONE_CONFIG_HTTPEERS_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_HTTPEERS_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_HTTPEERS_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_HTTPEERS_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_HTTPEERS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Not published: the HTTPEERS_S3_* secrets are not set."
            exit 0
          fi
          # The prefix is the site. A name the host would not serve (lowercase labels, at least
          # one dot) would only hide a mistake, and an empty one would be the bucket's root,
          # where `rclone sync` would delete every other site.
          label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
          if ! [[ "$SITE_DOMAIN" =~ ^$label(\.$label)+$ ]]; then
            echo "::error::SITE_DOMAIN '$SITE_DOMAIN' is not a host name the sites host serves."
            exit 1
          fi
          # An incomplete build must not replace the published site.
          test -f site/dist/index.html || { echo "::error::site/dist/index.html is missing."; exit 1; }

          sudo apt-get install -y -qq rclone >/dev/null
          # Within the site's own prefix: files the build no longer has are removed, after the
          # new ones are uploaded (rclone's default), so the site is never half missing.
          rclone sync site/dist "httpeers:sites/$SITE_DOMAIN" --checksum --stats-one-line -v
          echo "::notice::Published https://$SITE_DOMAIN (the host may serve old files for up to 60 s)."
