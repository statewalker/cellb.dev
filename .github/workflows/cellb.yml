name: cellb (lint, typecheck, unit tests, package)

# Every pull request: cellb's own checks, independent of the examples. Lint, typecheck and the unit
# tests (test/) on the sources; then the package as it is published (scripts/pack-check.mjs):
# `pnpm pack`, the packed manifest and files, and the tarball installed from npm outside the
# workspace and used from plain Node, TypeScript, and a Vite app in Chromium.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cellb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/cellb
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build
        run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: The published package (pack, install, Node, types, Vite + Chromium)
        run: node scripts/pack-check.mjs
