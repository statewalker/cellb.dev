name: cellb interop (celld)

# cellb against the real celld: storage format, LTX logs, ownership hand-over, alarms,
# every binding, a celld fleet node on S3 (RustFS), and Chromium on the shared bucket.
# scripts/interop-env.sh fetches the pinned celld and RustFS releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/cellb
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cellb-interop/bin
          key: interop-bin-celld-0.6.3-rustfs-1.0.3
      - run: pnpm run typecheck
      - name: Node — a Flue agent app on cellb
        run: pnpm --dir ../../examples/flue test
      - name: Node — the fake OpenAI-compatible model
        run: pnpm --dir ../fake-openai test
      - name: Node — pi and opencode agents on cellb, against the fake model
        run: pnpm --dir ../../examples/agents test
      - name: Node — celld conformance and interop
        run: pnpm run interop
      - run: pnpm exec playwright install --with-deps chromium
      - name: Chromium — browser hosts on the shared bucket
        run: pnpm run interop:browser
      - name: Chromium — a Flue agent app on cellb in a browser
        run: pnpm --dir ../../examples/flue test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: |
            ~/.cache/cellb-interop/rustfs.log
            packages/cellb/test-results/
