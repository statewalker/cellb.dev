name: examples-publish

# The browser examples as static sites on the httpeers host, on subdomains of cellb.dev, one host
# each: each one's ServiceWorker takes its whole origin, and each keeps its data (EmDash's posts,
# the notebook's npm code) apart from cellb.dev's and the others'.
#
#   examples.cellb.dev    examples/landing: links to the others
#   emdash.cellb.dev      examples/emdash's static build (EmDash built by Astro on Node)
#   astro.cellb.dev       examples/astro-in-browser's static build (Astro and EmDash built in the
#                         tab)
#   containers.cellb.dev  packages/containers/examples/browser-demos: Python in Wasmer containers
#                         and the notebook in Lifo containers (the notebook runs npm packages in
#                         its page's realm: an origin of its own, apart from cellb.dev's storage)
#
# They used to be cellb-<name>.httpeers.net: those hosts now get a page that sends every path to
# the same path on the new host (.github/scripts/redirect-site.sh).
#
# Run by hand ("Run workflow", or `gh workflow run examples-publish.yml`). Each build is tested in
# Chromium behind a plain file server before anything is published. One-level names under
# cellb.dev need nothing on the server: the zone has a wildcard DNS record (*.cellb.dev) and Caddy
# a wildcard certificate for *.cellb.dev in front of the sites host. The HTTPEERS_S3_* key must be
# allowed to write each host's prefix (site/scripts/setup-publish-secrets.sh, site/README.md).
on:
  workflow_dispatch:

concurrency:
  group: examples-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cellb.dev/examples
    steps:
      - uses: actions/checkout@v7
        with:
          path: cellb.dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cellb.dev/examples/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: cellb.dev/.nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        run: bash ${{ github.workspace }}/cellb.dev/.github/scripts/install-chromium.sh pnpm --dir emdash exec playwright

      - name: EmDash's static build, tested
        working-directory: cellb.dev/examples/emdash
        run: pnpm test:browser
      - name: The in-browser builder's static build, tested
        working-directory: cellb.dev/examples/astro-in-browser
        run: |
          pnpm build:static
          STATIC=1 pnpm exec playwright test test/browser/build-in-browser.spec.ts test/browser/emdash-in-browser.spec.ts

      - name: Publish
        env:
          RCLONE_CONFIG_HTTPEERS_TYPE: s3
          RCLONE_CONFIG_HTTPEERS_PROVIDER: Other
          RCLONE_CONFIG_HTTPEERS_ENDPOINT: https://s3.httpeers.net
          # Path-style addressing: virtual-host style would look up sites.s3.httpeers.net.
          RCLONE_CONFIG_HTTPEERS_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_HTTPEERS_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_HTTPEERS_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bash "${{ github.workspace }}/cellb.dev/.github/scripts/install-rclone.sh"
          publish() { # <dir> <domain>: within the domain's own prefix, new files first, then removals
            test -f "$1/index.html" || { echo "::error::$1/index.html is missing."; exit 1; }
            rclone sync "$1" "httpeers:sites/$2" --checksum --stats-one-line -v
            echo "::notice::Published https://$2 (the host may serve old files for up to 60 s)."
          }
          publish emdash/dist/static emdash.cellb.dev
          publish astro-in-browser/dist/static astro.cellb.dev
          publish landing examples.cellb.dev
          # the old hosts send their visitors to the new ones
          for name in examples emdash astro containers; do
            bash "${{ github.workspace }}/cellb.dev/.github/scripts/redirect-site.sh" "$RUNNER_TEMP/moved-$name" "https://$name.cellb.dev"
            publish "$RUNNER_TEMP/moved-$name" "cellb-$name.httpeers.net"
          done

  # The containers demos (packages/containers/examples/browser-demos), from the root workspace:
  # built for the root of their host, tested in Chromium behind a plain file server (both demos:
  # they need the Wasmer registry, the npm registry, jsDelivr and unpkg), then published.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        run: bash .github/scripts/install-chromium.sh pnpm --filter @statewalker/cellb-site exec playwright
      - name: The containers demos' static build, tested
        run: |
          pnpm --filter @statewalker/cellb-containers exec vite build --config examples/browser-demos/vite.config.ts
          DEMOS_DIST="$GITHUB_WORKSPACE/packages/containers/examples/browser-demos/dist" DEMOS_PATH=/ \
            pnpm --filter @statewalker/cellb-site check:containers
      - name: Publish
        env:
          RCLONE_CONFIG_HTTPEERS_TYPE: s3
          RCLONE_CONFIG_HTTPEERS_PROVIDER: Other
          RCLONE_CONFIG_HTTPEERS_ENDPOINT: https://s3.httpeers.net
          RCLONE_CONFIG_HTTPEERS_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_HTTPEERS_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_HTTPEERS_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/install-rclone.sh
          dir=packages/containers/examples/browser-demos/dist
          test -f "$dir/notebook/index.html" || { echo "::error::$dir/notebook/index.html is missing."; exit 1; }
          rclone sync "$dir" httpeers:sites/containers.cellb.dev --checksum --stats-one-line -v
          echo "::notice::Published https://containers.cellb.dev (the host may serve old files for up to 60 s)."
