<!doctype html>
<meta charset="utf-8" />
<title>cellb — partyserver in the browser</title>
<body>
  <script type="module">
    // One Dedicated Worker runs the partyserver host project (party-worker.ts); each call is
    // one operation on it: start, fetch, a socket's session, restart.
    const w = new Worker(new URL("./party-worker.ts", import.meta.url), { type: "module" });
    window.__party = (op) =>
      new Promise((resolve) => {
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = (e) => resolve(e.data);
        w.postMessage(op, [port2]);
      });
    document.body.dataset.ready = "true";
  </script>
</body>
