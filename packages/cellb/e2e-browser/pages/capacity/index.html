<!doctype html>
<meta charset="utf-8" />
<title>cellb — how many cells fit in a tab</title>
<body>
  <script type="module">
    // Workers that keep their runtimes between calls; the probe starts them and grows them.
    // Each worker has its own SQLite WASM heap and its own OPFS pool.
    const workers = [];
    const spawn = () =>
      workers.push(new Worker(new URL("./capacity-worker.ts", import.meta.url), { type: "module" })) - 1;
    window.__spawn = spawn;
    window.__capacity = (msg, i = 0) => {
      while (workers.length <= i) spawn();
      return new Promise((resolve, reject) => {
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = (e) => (e.data.ok ? resolve(e.data.v) : reject(new Error(e.data.error)));
        workers[i].postMessage(msg, [port2]);
      });
    };
    document.body.dataset.ready = "true";
  </script>
</body>
