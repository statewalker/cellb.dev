<!doctype html>
<meta charset="utf-8" />
<title>cellb — loadProject in a browser</title>
<body>
  <script type="module">
    // One fresh Dedicated Worker per run: loads a `cellb build` folder and fetches `paths`.
    window.__loadProject = (args) =>
      new Promise((resolve) => {
        const w = new Worker(new URL("./load-worker.ts", import.meta.url), { type: "module" });
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = (e) => {
          resolve(e.data);
          w.terminate();
        };
        w.onerror = (e) => resolve({ ok: false, error: e.message });
        w.postMessage(args, [port2]);
      });
    document.body.dataset.ready = "true";
  </script>
</body>
