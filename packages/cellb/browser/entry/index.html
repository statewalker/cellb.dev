<!doctype html>
<meta charset="utf-8" />
<title>cellb — the browser entry point</title>
<body>
  <script type="module">
    // One fresh Dedicated Worker per run.
    window.__runProject = (project) =>
      new Promise((resolve) => {
        const w = new Worker(new URL("./entry-worker.ts", import.meta.url), { type: "module" });
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = (e) => {
          resolve(e.data);
          w.terminate();
        };
        w.onerror = (e) => resolve({ ok: false, error: e.message });
        w.postMessage(project, [port2]);
      });
    document.body.dataset.ready = "true";
  </script>
</body>
