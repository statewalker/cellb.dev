<!doctype html>
<meta charset="utf-8" />
<title>webrun-cells — Miniflare simulators in the browser (P08)</title>
<body>
  <script type="module">
    let worker;
    window.__mf = (msg) => {
      worker ??= new Worker(new URL("./mf-worker.ts", import.meta.url), { type: "module" });
      return new Promise((resolve, reject) => {
        const { port1, port2 } = new MessageChannel();
        port1.onmessage = (e) => (e.data.ok ? resolve(e.data.v) : reject(new Error(e.data.error)));
        worker.postMessage(msg, [port2]);
      });
    };
    window.__mfRestart = () => { worker?.terminate(); worker = undefined; };
    document.body.dataset.ready = "true";
  </script>
</body>
