<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook in a container</title>
    <style>
      :root { color-scheme: light; font: 14px/1.4 system-ui, sans-serif; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; background: #f6f7f9; }
      header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #1f2430; color: #fff; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      #status { font-size: 13px; color: #c9d1e0; }
      #status[data-state="ready"] { color: #8ce99a; }
      #status[data-state="error"] { color: #ffa8a8; }
      main { display: grid; grid-template-columns: minmax(320px, 2fr) 3fr; gap: 12px; padding: 12px; min-height: 0; }
      section { display: flex; flex-direction: column; min-height: 0; background: #fff; border: 1px solid #dde1e7; border-radius: 8px; overflow: hidden; }
      section h2 { margin: 0; padding: 8px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5c6370; border-bottom: 1px solid #eceff3; }
      textarea { flex: 1; border: 0; padding: 12px; resize: none; font: 13px/1.5 ui-monospace, monospace; outline: none; }
      iframe { flex: 1; border: 0; width: 100%; }
      #log { margin: 0; padding: 8px 12px; max-height: 96px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; color: #5c6370; border-top: 1px solid #eceff3; }
    </style>
  </head>
  <body>
    <header><h1>Notebook in a container</h1><span id="status">starting…</span></header>
    <main>
      <section><h2>src/index.md</h2><textarea id="editor" spellcheck="false" disabled></textarea><pre id="log"></pre></section>
      <section><h2>Preview (observable preview, live reload)</h2><iframe id="preview" title="Notebook preview"></iframe></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
