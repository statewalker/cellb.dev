# gitleaks configuration for the secret scan in CI (statewalker/statewalker-ci's check-secrets.mjs).
# The default rules apply; each allowlist entry below says why its match is not a secret.

[extend]
useDefault = true

# packages/cellb/scripts/interop-env.sh starts a throwaway RustFS on 127.0.0.1 for the interop
# tests and creates a bucket with the credentials it just gave that server (RUSTFS_ACCESS_KEY /
# RUSTFS_SECRET_KEY a few lines above). They guard nothing outside the test run.
[[allowlists]]
description = "local RustFS test credentials in interop-env.sh"
condition = "AND"
paths = ['''^packages/cellb/scripts/interop-env\.sh$''']
regexes = ['''rustfsadmin:rustfssecret''']

# packages/containers/test/lifo-websocket.test.ts sends a WebSocket handshake by hand; its
# Sec-WebSocket-Key is the sample nonce of RFC 6455 section 1.3 (base64 of "the sample nonce"),
# a public example value that guards nothing.
[[allowlists]]
description = "RFC 6455's sample Sec-WebSocket-Key in a WebSocket test"
condition = "AND"
paths = ['''^packages/containers/test/lifo-websocket\.test\.ts$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
